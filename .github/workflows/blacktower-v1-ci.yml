name: BLACKTOWER OS V1 CI

on:
  push:
    branches:
      - feat/blacktower-os-v1
  pull_request:
    branches:
      - main

jobs:
  auth-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run authentication regression tests
        run: node --test --experimental-strip-types lib/portal/portal-auth.security.test.ts
